http:
  middlewares:
    security:
      headers:
        frameDeny: false
        contentSecurityPolicy: "frame-ancestors 'self' https://tagassistant.google.com https://*.google.com https://*.googletagmanager.com"
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: 'strict-origin-when-cross-origin'
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
